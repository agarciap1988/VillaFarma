<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Editar Perfil - Villa Farma</title>
        
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="css/style.css" />

        <style>
            html, body {
                height: 100%;
                margin: 0;
            }
            body {
                display: flex;
                flex-direction: column;
            }
            main {
                flex-grow: 1; 
                padding-top: 56px; 
            }
            .container-perfil {
                max-width: 700px;
                margin-top: 2rem !important;
                margin-bottom: 2rem !important;
            }
            .card-header-custom {
                background-color: #0d6efd;
                color: white;
                padding: 1rem;
                border-top-left-radius: 0.35rem;
                border-top-right-radius: 0.35rem;
            }
        </style>
    </head>
    
    <body>
        <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top shadow-sm">
            <div class="container">
                <a class="navbar-brand" href="index.html"><i class="fas fa-pills me-2"></i>Villa Farma</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html#inicio">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="index.html#productCatalog">Productos</a></li>

                        <li class="nav-item ms-2 me-2">
                            <a href="cart.html" class="btn btn-outline-primary position-relative" aria-label="Carrito de compras">
                                <i class="fas fa-shopping-cart"></i>
                                <span id="cartCount" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                                    0
                                    <span class="visually-hidden">Productos en el carrito</span>
                                </span>
                            </a>
                        </li>
                        
                        <li class="nav-item">
                            <span id="authContainer" class="d-flex align-items-center">
                                <a href="login.html" id="authBtn" class="btn btn-primary">
                                    <i class="fas fa-user me-1"></i> Iniciar Sesión
                                </a>
                            </span>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>


        <main>
            <div class="container container-perfil">
                <div class="card shadow">
                    <div class="card-header card-header-custom text-center">
                        <h2 class="h5 mb-0"><i class="fas fa-pencil-alt me-2"></i> Editar Mi Perfil de Usuario</h2> 
                    </div>

                    <div class="card-body p-4">
                        <form id="editProfileForm"> 
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="inputFirstName" class="form-label fw-bold">Nombre(s):</label>
                                    <input type="text" class="form-control" id="inputFirstName" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="inputLastName" class="form-label fw-bold">Apellido(s):</label>
                                    <input type="text" class="form-control" id="inputLastName" required>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-bold">DNI:</label>
                                    <input type="text" class="form-control" id="inputDni" disabled> 
                                </div>

                                <div class="col-md-6">
                                    <label for="inputEmail" class="form-label fw-bold">Correo Electrónico:</label>
                                    <input type="email" class="form-control" id="inputEmail" required>
                                </div>

                                <div class="col-md-6">
                                    <label for="inputPhone" class="form-label fw-bold">Teléfono:</label>
                                    <input type="tel" class="form-control" id="inputPhone">
                                </div>

                                <div class="col-md-6">
                                    <label for="inputBirthDate" class="form-label fw-bold">Fecha de Nacimiento:</label>
                                    <input type="text" class="form-control" id="inputBirthDate" disabled>
                                </div>

                            </div>

                            <div class="d-flex justify-content-end mt-4 pt-3 border-top">
                                <a href="perfil.html" class="btn btn-secondary me-2">Cancelar</a>
                                <button type="submit" class="btn btn-primary"><i class="fas fa-save me-2"></i> Guardar Cambios</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>


        <footer class="bg-dark text-white py-3 mt-auto"> <div class="container text-center">
                <p class="mb-1">Villa Farma - Tu farmacia de confianza desde 2003</p>
                <div>
                    <a href="#" class="text-white mx-2"><i class="fab fa-facebook"></i></a>
                    <a href="#" class="text-white mx-2"><i class="fab fa-instagram"></i></a>
                    <a href="#" class="text-white mx-2"><i class="fab fa-whatsapp"></i></a>
                </div>
            </div>
        </footer>


        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> 
        <script src="js/general-cart.js"></script> 
        <script src="js/profile.js"></script> 
        
    </body>
</html>
