<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tienda - Villa Farma</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="fas fa-pills me-2"></i>Villa Farma</a>
      <div class="ms-auto">
        <button class="btn btn-outline-secondary me-2" onclick="logout()">Cerrar Sesión</button>
        <button class="btn btn-primary" onclick="irAlCarrito()">
          <i class="fas fa-shopping-cart me-2"></i> Ver Carrito
          <span class="badge bg-danger" id="cartCount">0</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Catálogo -->
  <div class="container my-5">
    <h2 class="mb-4">Catálogo de Productos</h2>
    <div class="row" id="catalogo"></div>
  </div>

  <script src="js/script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
