<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registro - Villa Farma</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="bg-light">

  <!-- Contenedor Registro -->
  <div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow-lg p-4" style="max-width: 500px; width: 100%;">
      <div class="text-center mb-4">
        <i class="fas fa-user-plus fa-2x text-primary"></i>
        <h3 class="mt-2">Crear Cuenta</h3>
        <p class="text-muted">Regístrate para empezar a comprar</p>
      </div>

      <!-- Formulario -->
      <form id="registerForm">
        <div class="mb-3">
          <label for="dni" class="form-label">DNI</label>
          <input type="text" id="dni" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="firstName" class="form-label">Nombres</label>
          <input type="text" id="firstName" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="lastName" class="form-label">Apellidos</label>
          <input type="text" id="lastName" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Correo Electrónico</label>
          <input type="email" id="email" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="phone" class="form-label">Celular</label>
          <input type="text" id="phone" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="birthDate" class="form-label">Fecha de Nacimiento</label>
          <input type="date" id="birthDate" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" id="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Registrarse</button>
      </form>

      <!-- Mensajes -->
      <div id="registerSuccess" class="alert alert-success mt-3 d-none"></div>
      <div id="registerError" class="alert alert-danger mt-3 d-none"></div>

      <!-- Link a login -->
      <div class="text-center mt-3">
        <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
      </div>
    </div>
  </div>
  
  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/register.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
