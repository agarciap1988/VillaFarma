<!DOCTYPE html>
<html>
    <head>
        <title>Mi Historial de Pedidos - Villa Farma</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
        <link rel="stylesheet" href="css/style.css" />
        <style>
            html, body {
                height: 100%;
                margin: 0;
            }
            body {
                display: flex;
                flex-direction: column;
            }
            main {
                flex: 1;
                padding-top: 80px;
            }
        </style>
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top shadow-sm">
            <div class="container">
                <a class="navbar-brand" href="index.html"><i class="fas fa-pills me-2"></i>Villa Farma</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html#inicio">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="index.html#productCatalog">Productos</a></li>

                        <li class="nav-item ms-2 me-2">
                            <a href="cart.html" class="btn btn-outline-primary position-relative" aria-label="Carrito de compras">
                                <i class="fas fa-shopping-cart"></i>
                                <span id="cartCount" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                                    0
                                    <span class="visually-hidden">Productos en el carrito</span>
                                </span>
                            </a>
                        </li>

                        <li class="nav-item">
                            <span id="authContainer" class="d-flex align-items-center">
                                <a href="login.html" id="authBtn" class="btn btn-primary">
                                    <i class="fas fa-user me-1"></i> Iniciar Sesión
                                </a>
                            </span>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        
        <main>
            <section class="container my-5">
                <h1 class="mb-4 text-center">📜 Historial de Pedidos</h1>
                <div id="history-content" class="bg-white p-4 rounded shadow-lg">
                    <!-- Contenido dinámico cargado por JavaScript -->
                    <div class="text-center">
                        <i class="fas fa-spinner fa-spin fa-2x text-primary"></i>
                        <p class="mt-2">Cargando historial...</p>
                    </div>
                </div>
            </section>
        </main>

        <footer class="footer-section text-center mt-5">
            <div class="container">
                <p class="mb-1">Villa Farma - Tu farmacia de confianza desde 2003</p>
                <div class="social-links">
                    <a href="#"><i class="fab fa-facebook me-2"></i></a>
                    <a href="#"><i class="fab fa-instagram me-2"></i></a>
                    <a href="#"><i class="fab fa-whatsapp"></i></a>
                </div>
            </div>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

        <script src="js/login.js"></script>    
        <script src="js/general-cart.js"></script>    
        <script src="js/profile.js"></script>
        <script src="js/order-history.js"></script> 
    </body>
</html>
