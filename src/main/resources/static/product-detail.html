<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title id="productTitle">Detalle del Producto - Villa Farma</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"/>
        <link rel="stylesheet" href="css/style.css"/>
        <link rel="stylesheet" href="css/products.css"/>
        <link rel="stylesheet" href="css/productCatalog.css"/>
        <style>
            .detail-card {
                padding: 30px;
                border-radius: 10px;
                background-color: #f8f9fa;
                height: 100%; /* CLAVE para alinear verticalmente el contenido */
            }
            .zoom-container {
                position: relative;
                overflow: hidden;
                border-radius: 10px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
                cursor: crosshair;
            }
            .zoom-image {
                display: block;
                width: 100%;
                transition: transform 0.15s ease-out;
                transform-origin: 0% 0%;
            }
            /* ESTILO PARA EL BOTÓN DE CARRITO CON CONTADOR FLOTANTE */
            .btn-cart-nav {
                /* Usado para asegurar que el badge se posicione correctamente */
                position: relative;
                padding: .375rem .75rem;
                margin-left: .5rem;
            }
            /* Ajuste el badge para que se centre mejor */
            .btn-cart-nav .badge {
                /* Ajuste fino para la posición */
                transform: translate(-10%, -30%);
            }
        </style>
    </head>
    <body>

        <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top shadow-sm">
            <div class="container">
                <a class="navbar-brand" href="index.html"><i class="fas fa-pills me-2"></i>Villa Farma</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html#inicio">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" href="index.html#servicios">Servicios</a></li>
                        <li class="nav-item"><a class="nav-link" href="index.html#productCatalog">Productos</a></li>
                        <li class="nav-item"><a class="nav-link" href="index.html#contacto">Contacto</a></li>

                        <li class="nav-item">
                            <a href="cart.html" class="btn btn-outline-primary btn-cart-nav position-relative">
                                <i class="fas fa-shopping-cart"></i> 
                                <span id="cartCount" class="badge bg-danger rounded-pill position-absolute top-0 start-100 translate-middle">0</span>
                            </a>
                        </li>

                        <li class="nav-item">
                            <a href="login.html" class="btn btn-primary ms-2"><i class="fas fa-user me-1"></i> Iniciar sesión</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <main class="container my-5 py-5">

            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="index.html">Inicio</a></li>
                    <li class="breadcrumb-item"><a href="index.html#productCatalog">Catálogo</a></li>
                    <li class="breadcrumb-item active" aria-current="page" id="breadcrumbName">Cargando...</li>
                </ol>
            </nav>

            <div id="productDetailSection" class="row g-5">

                <div class="col-12 text-center" id="loadingMessage">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Cargando...</span>
                    </div>
                    <p class="mt-2">Cargando detalles del producto...</p>
                </div>

                <div class="col-md-6 d-none" id="productImageCol">
                    <div class="zoom-container">
                        <img id="productImage" src="" class="zoom-image" alt="Imagen del Producto">
                    </div>
                </div>

                <div class="col-md-6 d-none" id="productInfoCol">
                    <div class="detail-card d-flex flex-column"> 
                        <h1 id="productName" class="display-5 fw-bold text-primary mb-3"></h1>

                        <div class="mb-4">
                            <h4 class="text-secondary">Descripción Detallada:</h4>
                            <p id="productLongDescription" class="lead"></p>
                        </div>

                        <div class="mb-4">
                            <h4 class="text-secondary">Presentación:</h4>
                            <p id="productPresentation" class="fs-5"></p>
                        </div>

                        <h2 id="productPrice" class="text-danger mb-4"></h2>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Cantidad:</label>
                            <div class="input-group" style="width: 150px;">
                                <button class="btn btn-outline-primary" type="button" id="minusBtn">-</button>
                                <input type="text" class="form-control text-center" id="productQuantity" value="1" readonly>
                                <button class="btn btn-outline-primary" type="button" id="plusBtn">+</button>
                            </div>
                        </div>

                        <div  class="d-grid gap-2 mt-auto"> 
                            <button id="addToCartBtn" class="btn btn-primary btn-lg"><i class="fas fa-shopping-cart me-2"></i> Agregar al Carrito</button>
                            <a href="index.html#productCatalog" class="btn btn-outline-secondary btn-lg"><i class="fas fa-arrow-left me-2"></i> Volver al Catálogo</a>
                        </div>
                    </div>
                </div>

            </div>
        </main>

        <footer class="footer-section text-center mt-5">
            <div class="container">
                <p class="mb-1">Villa Farma - Tu farmacia de confianza desde 2003</p>
                <div class="social-links">
                    <a href="#"><i class="fab fa-facebook me-2"></i></a>
                    <a href="#"><i class="fab fa-instagram me-2"></i></a>
                    <a href="#"><i class="fab fa-whatsapp"></i></a>
                </div>
            </div>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/product-detail.js"></script> 
        <script src="js/general-cart.js"></script>
    </body>
</html>
